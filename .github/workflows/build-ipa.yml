name: Build unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build (unsigned)
        working-directory: ios
        run: |
          xcodebuild \
            -project PhoneLink.xcodeproj \
            -scheme PhoneLink \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        working-directory: ios
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/PhoneLink.app Payload/
          zip -qry PhoneLink-unsigned.ipa Payload
          ls -la PhoneLink-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhoneLink-unsigned-ipa
          path: ios/PhoneLink-unsigned.ipa

      - name: Attach IPA to "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: PhoneLink (latest build)
          body: >
            Unsigned IPA built from the latest commit.
            Install from Windows with Sideloadly (sideloadly.io): plug in the
            iPhone, drop this IPA in, sign in with your Apple ID.
          files: ios/PhoneLink-unsigned.ipa
